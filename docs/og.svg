<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ThousandWorlds Explorer — every confirmed exoplanet, and the climates they might have">
  <!-- Social share card (1200×630). Rasterize with:
       rsvg-convert -w 1200 -h 630 docs/og.svg -o public/og.png -->
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#131b33"/>
      <stop offset="1" stop-color="#080b16"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="900" cy="290" r="150"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- starfield -->
  <g fill="#7c88ad">
    <circle cx="90" cy="80" r="2"/><circle cx="220" cy="150" r="1.4"/><circle cx="340" cy="60" r="1.7"/>
    <circle cx="520" cy="110" r="1.3"/><circle cx="640" cy="55" r="2"/><circle cx="150" cy="480" r="1.5"/>
    <circle cx="300" cy="540" r="1.8"/><circle cx="560" cy="500" r="1.3"/><circle cx="700" cy="560" r="1.6"/>
    <circle cx="1080" cy="90" r="1.5"/><circle cx="1140" cy="500" r="1.8"/><circle cx="990" cy="560" r="1.3"/>
    <circle cx="60" cy="300" r="1.4"/><circle cx="420" cy="330" r="1.2"/><circle cx="1160" cy="300" r="1.4"/>
  </g>

  <!-- the lens over scattered worlds (brand motif, from docs/logo.svg) -->
  <line x1="1005" y1="395" x2="1105" y2="495" stroke="#c7d4ee" stroke-width="42" stroke-linecap="round"/>
  <g clip-path="url(#lens)">
    <circle cx="900" cy="290" r="150" fill="#0d1322"/>
    <circle cx="828" cy="233" r="4" fill="#7c88ad"/>
    <circle cx="963" cy="203" r="3.6" fill="#7c88ad"/>
    <circle cx="858" cy="378" r="3.8" fill="#7c88ad"/>
    <circle cx="883" cy="283" r="50" fill="#fbe7c4"/>
    <circle cx="988" cy="263" r="27" fill="#6fa8ff"/>
    <circle cx="828" cy="353" r="20" fill="#46d49a"/>
    <circle cx="953" cy="363" r="17" fill="#f0b24a"/>
    <circle cx="973" cy="320" r="11" fill="#e2685a"/>
  </g>
  <circle cx="900" cy="290" r="150" fill="none" stroke="#c7d4ee" stroke-width="20"/>

  <!-- wordmark -->
  <text x="80" y="270" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#eaf0ff">
    <tspan fill="#6fa8ff">Thousand</tspan>Worlds
  </text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="400" fill="#8b97b8">Explorer</text>

  <!-- tagline -->
  <text x="80" y="430" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#c7d4ee">Every confirmed exoplanet — and the climates</text>
  <text x="80" y="472" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#c7d4ee">they might have.</text>

  <!-- credit line -->
  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d6a8c">NASA Exoplanet Archive · 6,000+ worlds · 1,659 GCM climate simulations</text>
</svg>
