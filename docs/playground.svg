<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-label="How the Imagine Lab turns real detections and simulated physics into an articulated hypothesis">
  <rect x="0" y="0" width="800" height="700" rx="16" fill="#080b16"/>
  <g fill="#cdd6f4">
    <circle cx="60" cy="60" r="1" opacity="0.5"/><circle cx="150" cy="200" r="1.3" opacity="0.35"/>
    <circle cx="700" cy="80" r="1" opacity="0.5"/><circle cx="760" cy="260" r="1.2" opacity="0.4"/>
    <circle cx="40" cy="420" r="1" opacity="0.4"/><circle cx="780" cy="520" r="1.1" opacity="0.45"/>
    <circle cx="120" cy="620" r="1" opacity="0.35"/><circle cx="660" cy="640" r="1.2" opacity="0.4"/>
    <circle cx="400" cy="40" r="1" opacity="0.3"/><circle cx="240" cy="360" r="1" opacity="0.3"/>
    <circle cx="560" cy="330" r="1" opacity="0.3"/><circle cx="30" cy="240" r="1" opacity="0.35"/>
  </g>

  <text x="400" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="500" fill="#e7ebf7">The Imagine Lab — coming soon</text>
  <text x="400" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#9aa3be">Overlay real detections + simulated physics &#8594; an articulated, falsifiable hypothesis</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b748f"/>
    </marker>
  </defs>
  <g fill="none" stroke="#6b748f" stroke-width="1.5" marker-end="url(#ar)">
    <path d="M237 182 L352 244"/>
    <path d="M565 182 L450 244"/>
    <path d="M352 332 L218 390"/>
    <path d="M450 332 L582 390"/>
    <path d="M218 478 L322 518"/>
    <path d="M582 478 L478 518"/>
    <path d="M400 594 L400 604"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="95" y="108" width="285" height="72" rx="8" fill="none" stroke="#6fa8ff" stroke-width="1.6"/>
    <rect x="420" y="108" width="290" height="72" rx="8" fill="none" stroke="#46d49a" stroke-width="1.6"/>
    <rect x="265" y="246" width="270" height="86" rx="8" fill="none" stroke="#8590b0" stroke-width="1.6"/>
    <rect x="70" y="390" width="290" height="86" rx="8" fill="none" stroke="#6fa8ff" stroke-width="1.6"/>
    <rect x="440" y="390" width="290" height="86" rx="8" fill="none" stroke="#46d49a" stroke-width="1.6"/>
    <rect x="210" y="518" width="380" height="76" rx="8" fill="none" stroke="#f0b24a" stroke-width="1.8"/>
    <rect x="285" y="606" width="230" height="48" rx="24" fill="rgba(240,178,74,0.12)" stroke="#f0b24a" stroke-width="1.8"/>

    <g text-anchor="middle" fill="#e7ebf7" font-size="16" font-weight="500">
      <text x="237" y="140">Real detections — NASA</text>
      <text x="565" y="140">Climate physics — ThousandWorlds</text>
      <text x="400" y="280">Overlay engine</text>
      <text x="215" y="422">Re-estimated climate</text>
      <text x="585" y="422">Under-sampled gaps</text>
      <text x="400" y="552">Rigor gate — what's still missing?</text>
      <text x="400" y="636">Articulated hypothesis</text>
    </g>
    <g text-anchor="middle" fill="#9aa3be" font-size="12.5">
      <text x="237" y="162">~6,300, observation-biased</text>
      <text x="565" y="162">1,659 simulated runs</text>
      <text x="400" y="302">translate &#183; interpolate &#183; compare</text>
      <text x="400" y="320">find honest white space</text>
      <text x="215" y="444">real planet + stated assumptions</text>
      <text x="585" y="444">bias-checked, not "must exist"</text>
      <text x="400" y="574">assumptions &#183; confounder &#183; test &#183; novelty</text>
    </g>

    <g font-size="12.5" fill="#9aa3be">
      <circle cx="246" cy="678" r="5" fill="#6fa8ff"/><text x="258" y="682">observed</text>
      <circle cx="372" cy="678" r="5" fill="#46d49a"/><text x="384" y="682">simulated</text>
      <circle cx="506" cy="678" r="5" fill="#f0b24a"/><text x="518" y="682">your rigor work</text>
    </g>
  </g>
