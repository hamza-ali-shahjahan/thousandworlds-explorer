<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Get started — open it in your browser, or run your own copy in three simple steps" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="1280" height="400" rx="18" fill="#080b16"/>
  <g fill="#cdd6f4">
    <circle cx="70" cy="60" r="1.2" opacity="0.5"/><circle cx="1180" cy="70" r="1.3" opacity="0.45"/>
    <circle cx="1230" cy="300" r="1" opacity="0.4"/><circle cx="60" cy="330" r="1.1" opacity="0.4"/>
    <circle cx="40" cy="180" r="1" opacity="0.3"/><circle cx="1245" cy="160" r="1" opacity="0.35"/>
    <circle cx="640" cy="34" r="1" opacity="0.3"/><circle cx="300" cy="50" r="1" opacity="0.3"/>
  </g>
  <circle cx="1150" cy="70" r="9" fill="#46d49a" opacity="0.85"/>
  <circle cx="110" cy="92" r="7" fill="#f0b24a" opacity="0.8"/>
  <circle cx="1210" cy="345" r="6" fill="#e24b4a" opacity="0.8"/>

  <text x="640" y="86" text-anchor="middle" font-size="46" font-weight="500"><tspan fill="#6fa8ff">Get</tspan><tspan fill="#e7ebf7"> started</tspan></text>
  <text x="640" y="124" text-anchor="middle" font-size="18" fill="#9aa3be">Open it in your browser — or run your own copy in about five minutes.</text>

  <g>
    <rect x="120" y="170" width="300" height="120" rx="12" fill="rgba(111,168,255,0.045)" stroke="#232b45" stroke-width="1.2"/>
    <rect x="490" y="170" width="300" height="120" rx="12" fill="rgba(111,168,255,0.045)" stroke="#232b45" stroke-width="1.2"/>
    <rect x="860" y="170" width="300" height="120" rx="12" fill="rgba(111,168,255,0.045)" stroke="#232b45" stroke-width="1.2"/>

    <g font-size="22" font-weight="500" text-anchor="middle">
      <circle cx="162" cy="212" r="18" fill="#6fa8ff"/><text x="162" y="220" fill="#08111f">1</text>
      <circle cx="532" cy="212" r="18" fill="#6fa8ff"/><text x="532" y="220" fill="#08111f">2</text>
      <circle cx="902" cy="212" r="18" fill="#6fa8ff"/><text x="902" y="220" fill="#08111f">3</text>
    </g>
    <g font-size="18" font-weight="500" fill="#e7ebf7">
      <text x="194" y="208">Install Node.js</text>
      <text x="564" y="208">Download the app</text>
      <text x="934" y="208">Run two commands</text>
    </g>
    <g font-size="13.5" fill="#9aa3be">
      <text x="194" y="232">free · nodejs.org</text>
      <text x="564" y="232">Code ▸ Download ZIP</text>
    </g>
    <text x="934" y="232" font-size="13" fill="#9aa3be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm install · npm run dev</text>

    <g stroke="#6fa8ff" stroke-width="2" fill="none" opacity="0.8">
      <path d="M442 230 l22 0"/><path d="M458 224 l8 6 -8 6"/>
      <path d="M812 230 l22 0"/><path d="M828 224 l8 6 -8 6"/>
    </g>
  </g>

  <rect x="360" y="324" width="560" height="46" rx="23" fill="rgba(70,212,154,0.08)" stroke="#46d49a" stroke-width="1.3"/>
  <g stroke="#46d49a" stroke-width="1.3" fill="none">
    <circle cx="404" cy="347" r="9"/><line x1="395" y1="347" x2="413" y2="347"/><ellipse cx="404" cy="347" rx="4" ry="9"/>
  </g>
  <text x="648" y="352" text-anchor="middle" font-size="15.5" fill="#cdeede">Just want to look? Open the live site — no install needed.</text>
