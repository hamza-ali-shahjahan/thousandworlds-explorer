# Hourly production health check for thousandworldsexplorer.com.
# Runs scripts/health-check.mjs (pure node, zero deps) against the LIVE site:
# gated home + door markers in the bundle, data freshness, World of the Day,
# the public emulator (landing/door/weights/registry), SEO + legal surfaces,
# and — when the keep-alive secrets are configured — Supabase reachability.
# Any failure fails the run, and GitHub emails the repo owner automatically.
name: Health check

on:
  schedule:
    - cron: '7 * * * *' # every hour at :07
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/health-check.mjs
